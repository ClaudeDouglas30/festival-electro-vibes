
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billetterie - Electro Vibes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Billetterie Electro Vibes</h1>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="programme.html">Programme</a>
            <a href="artistes.html">Artistes</a>
            <a href="billetterie.html">Billetterie</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Réservez vos billets !</h2>
            <p>Participez à une expérience musicale inoubliable.</p>
        </section>

        <section class="ticket-form">
            <h2>Formulaire de réservation</h2>

            <form id="reservationForm">

                <label for="nom">Nom complet :</label>
                <input type="text" id="nom" name="nom"
                       placeholder="Votre nom complet" required>

                <label for="email">Adresse e-mail :</label>
                <input type="email" id="email" name="email"
                       placeholder="exemple@email.com" required>

                <label for="typeBillet">Type de billet :</label>
                <select id="typeBillet" name="typeBillet" required>
                    <option value="">Choisir un billet</option>
                    <option value="150">Pass journée - 150 DH</option>
                    <option value="350">Pass Weekend - 350 DH</option>
                    <option value="600">Pass VIP - 600 DH</option>
                </select>

                <label for="quantite">Nombre de billets :</label>
                <input type="number" id="quantite" name="quantite"
                       min="1" max="10" value="1" required>

                <p id="total">Montant total : 0 DH</p>

                <button type="submit" class="btn">
                    Réserver maintenant
                </button>

            </form>

            <p id="message"></p>
        </section>
    </main>

    <footer>
        <p>© 2026 Electro Vibes Festival</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
